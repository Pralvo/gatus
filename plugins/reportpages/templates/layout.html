{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{.Title}} · {{.Site}}</title>
{{with .Description}}<meta name="description" content="{{.}}">
<meta property="og:description" content="{{.}}">
{{end}}<meta property="og:title" content="{{.Title}}">
<meta property="og:site_name" content="{{.Site}}">
<meta property="og:type" content="article">
{{if .Feeds}}<link rel="alternate" type="application/atom+xml" title="{{.Site}} (Atom)" href="/feed/atom.xml">
<link rel="alternate" type="application/rss+xml" title="{{.Site}} (RSS)" href="/feed/rss.xml">
<link rel="alternate" type="application/feed+json" title="{{.Site}} (JSON Feed)" href="/feed/feed.json">
{{end}}<style>{{.Style}}</style>
{{with .App}}{{range .Assets.Stylesheets}}<link rel="stylesheet" crossorigin href="{{.}}">
{{end}}<script type="application/json" id="page-config">{{.Settings}}</script>
{{range .Assets.Scripts}}<script type="module" crossorigin src="{{.}}"></script>
{{end}}{{end}}</head>
<body>
<div id="root"><div class="plain">
<header class="top"><a href="/">{{.Site}}</a><a href="/reports">Reports</a></header>
<main>
{{template "content" .Body}}
</main>
</div></div>
</body>
</html>
{{end}}
