# Changed by Pralvo: checks the React interface in web/ui instead of the Vue one.
name: test-ui
on:
  pull_request:
    paths:
      - 'web/**'
  push:
    branches:
      - master
    paths:
      - 'web/**'
jobs:
  ui-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/ui/package-lock.json
      - run: make ui-install
      - run: make ui-check
      # make ui-check rebuilds web/static, so any difference means the committed
      # build is out of date with web/ui.
      - name: Committed build is current
        run: |
          git add -N web/static
          git diff --exit-code --stat -- web/static
